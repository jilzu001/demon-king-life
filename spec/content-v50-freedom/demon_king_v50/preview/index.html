<script>
const DATA={"nodes":{"birth":{"id":"birth","kind":"scene","age":0,"title":"첫째 날, 나라가 정한 이름","body":"왕국력 800년, 당신은 인간으로 태어났다. 집은 비가 오면 지붕이 샜고 아버지는 누더기 소매로 새는 곳을 막았다. 출생신고소의 서기관은 안경을 고쳐 쓰며 이름을 확인했다.\n\n“종족, 인간. 건강, 양호. 직업, 마왕.”\n\n“잠깐만요.” 어머니가 아기를 더 꼭 안았다. “직업은 자라서 정하는 거 아닌가요?”\n\n서기관은 대답 대신 다른 서류를 꺼냈다. 거기에는 아기가 태어나기 사흘 전의 날짜가 찍혀 있었다. ‘국방 정책상 차기 위협 대상 지정’.\n\n아버지가 물었다. “우리 아이는 아직 울 줄밖에 모르는데요?”\n\n“울음은 위협 분류에서 제외하겠습니다.”\n\n어머니는 서기관의 깃펜을 내려놓았다. 어른 세 명 사이에 아직 말하지 못하는 아이 한 명이 있었다.","choices":[{"id":"birth_appeal","text":"부모는 출생 등록에 공식 이의를 신청한다.","outcomes":[{"id":"out_birth_appeal","weight":1,"result":"mixed","to":{"kind":"node","id":"child"},"narrative":"접수증은 얻었다. 정정은 보장받지 못했다.","effects":[{"op":"addToSet","path":"flags","value":"family_appealed"}]}]},{"id":"birth_salary","text":"부모는 마왕의 급여와 안전 책임을 묻는다.","outcomes":[{"id":"out_birth_salary","weight":1,"result":"neutral","to":{"kind":"node","id":"child"},"narrative":"서기관은 지급 규정부터 찾아보겠다고 했다.","effects":[{"op":"addToSet","path":"flags","value":"family_salary_question"}]}]},{"id":"birth_copy","text":"부모는 서명하기 전 모든 서류를 복사해 보관한다.","outcomes":[{"id":"out_birth_copy","weight":1,"result":"mixed","to":{"kind":"node","id":"child"},"narrative":"아버지의 주머니가 작은 종이들로 두꺼워졌다.","effects":[{"op":"addToSet","path":"flags","value":"family_original_copy"}]}]}],"chronicleSummary":"첫째 날, 나라가 정한 이름"},"child":{"id":"child","kind":"scene","age":12,"title":"열두 살, 나무칼과 이름표","body":"열두 살이 되자 미나가 나무칼 두 자루를 들고 찾아왔다. 그녀는 당신보다 빨리 달리고, 멀리 뛰고, 싸울 때도 절대로 뒤를 보지 않았다. 당신이 가진 재주는 글씨를 똑바로 쓰는 것과, 잃어버린 물건을 마지막으로 본 자리를 기억하는 것이었다.\n\n미나가 말했다. “나 용사가 될 거야.”\n\n“그럼 마왕을 잡아야 해?”\n\n“시험 규정에는 그렇게 써 있어.”\n\n“내 이름도 써 있어?”\n\n미나는 오래된 시험지를 펼쳐 한참 바라봤다. “있네.”\n\n두 사람은 해가 질 때까지 칼을 휘두르지 않았다. 미나는 무엇을 지킬 사람인지 생각했고 당신은 누가 적을 정할 권리가 있는지 생각했다.","choices":[{"id":"child_pact","text":"미나와 누구도 다치게 하지 않는 약속을 쓴다.","outcomes":[{"id":"out_child_pact","weight":1,"result":"mixed","to":{"kind":"node","id":"exam"},"narrative":"미나는 나무칼 손잡이에 짧은 선을 새겼다.","effects":[{"op":"addToSet","path":"flags","value":"mina_pact"}]}]},{"id":"child_names","text":"왕국 명부에 적힌 다른 아이들의 이름을 조사한다.","outcomes":[{"id":"out_child_names","weight":1,"result":"mixed","to":{"kind":"node","id":"exam"},"narrative":"당신은 자신만의 이야기가 아니라는 것을 처음 알았다.","effects":[{"op":"addToSet","path":"flags","value":"child_names"}]}]},{"id":"child_train","text":"미나와 끝까지 대련하며 스스로를 지킬 방법을 배운다.","outcomes":[{"id":"out_child_train","weight":1,"result":"mixed","to":{"kind":"node","id":"exam"},"narrative":"전투력은 크게 오르지 않았지만 도망치는 길은 외웠다.","effects":[{"op":"addToSet","path":"flags","value":"child_training"}]}]}],"chronicleSummary":"열두 살, 나무칼과 이름표"},"exam":{"id":"exam","kind":"scene","age":20,"title":"스무 살, 시험 문제가 된 사람","body":"용사 시험 실기장은 사람으로 가득했다. 당신은 피고석처럼 생긴 나무 울타리 안에 서 있었고, 미나는 갑옷을 입고 당신 맞은편에 섰다.\n\n감독관이 외쳤다. “공인 용사 실기 과제, 국가 지정 마왕 제압!”\n\n“제가 왜 시험 문제입니까?” 당신이 물었다.\n\n“어릴 때부터 국가가 관리한 마왕이니까.”\n\n“관리는 누가 받았는데요?”\n\n감독관은 답하지 않았다. 미나는 칼을 들었다가 내렸다. 여덟 해 동안 알았던 얼굴을 오늘부터 적으로 부르라는 명령이 그녀의 손끝에 걸려 있었다.\n\n여기서부터 당신의 인생은 한 사건으로 돌아오지 않는다. 무엇을 지킬지 선택해야 한다.","choices":[{"id":"exam_flee","text":"시험장을 벗어나 스스로 살아남을 길을 찾는다.","outcomes":[{"id":"out_exam_flee","weight":1,"result":"mixed","to":{"kind":"node","id":"gate_fugitive"},"narrative":"당신은 미나를 공격하지 않고 울타리를 넘어섰다.","effects":[{"op":"addToSet","path":"flags","value":"exam_fled"}]}]},{"id":"exam_object","text":"시험의 근거를 묻고 법적 책임을 추적한다.","outcomes":[{"id":"out_exam_object","weight":1,"result":"mixed","to":{"kind":"node","id":"gate_reform"},"narrative":"감독관은 당신을 제압할 수 있었지만 질문을 지우지는 못했다.","effects":[{"op":"addToSet","path":"flags","value":"exam_objected"}]}]},{"id":"exam_fee","text":"마왕 출연료를 청구하고 돈의 흐름을 추적한다.","outcomes":[{"id":"out_exam_fee","weight":1,"result":"mixed","to":{"kind":"node","id":"gate_money"},"narrative":"당신이 내민 청구서 때문에 시험은 잠시 멈췄다.","effects":[{"op":"addToSet","path":"flags","value":"exam_fee"}]}]},{"id":"exam_mina","text":"미나에게 칼을 내려놓으라고 부탁한다.","outcomes":[{"id":"out_exam_mina","weight":1,"result":"mixed","to":{"kind":"node","id":"gate_mina"},"narrative":"당신은 그녀의 선택을 대신하지 않고 기다렸다.","effects":[{"op":"addToSet","path":"flags","value":"exam_mina"}]}]}],"chronicleSummary":"스무 살, 시험 문제가 된 사람"},"gate_fugitive":{"id":"gate_fugitive","kind":"scene","age":21,"title":"왕국 밖과 왕국 안의 거리","body":"당신은 도망자가 됐다. 왕국은 포고문에 당신이 용사 시험을 파괴했다고 썼다. 실제로 부서진 것은 시험장의 얇은 울타리였다. 국경에서 만난 사람들은 당신이 유명한지보다 오늘 밤 잘 곳이 있는지 궁금해했다. 이제 도망치는 삶과 되돌아가 싸우는 삶 중 하나를 선택할 수 있었다.","choices":[{"id":"gate_to_exile","text":"국경의 피난민들과 남는다","outcomes":[{"id":"out_gate_to_exile","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_opening"},"narrative":"당신은 혼자 숨는 대신, 국가가 버린 다른 이름들을 외우기로 했다.","effects":[{"op":"addToSet","path":"flags","value":"route_exile"}]}]},{"id":"gate_to_resistance","text":"국가가 시킨 폭력을 거부하고 저항한다","outcomes":[{"id":"out_gate_to_resistance","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_opening"},"narrative":"전투력으로는 아무도 이길 수 없기에, 누구도 죽이지 않는 저항을 택했다.","effects":[{"op":"addToSet","path":"flags","value":"route_resistance"}]}]}],"chronicleSummary":"왕국 밖과 왕국 안의 거리"},"gate_reform":{"id":"gate_reform","kind":"scene","age":21,"title":"접수번호가 된 항의","body":"민원 창구 직원이 접수증을 밀었다. “본인의 마왕 지정에 항의하는 거군요. 신분을 확인해 주세요.” 당신은 마왕 증명서를 내밀었다. 직원은 절차상 문제가 없다고 말했다. 당신은 그 말이 왜 이렇게 절망적으로 들리는지 궁금했다. 원본 하나를 지키는 일과 사람들과 힘을 모으는 일, 길은 둘이었다.","choices":[{"id":"gate_to_evidence","text":"한 장의 원본을 끝까지 지킨다","outcomes":[{"id":"out_gate_to_evidence","weight":1,"result":"mixed","to":{"kind":"node","id":"route_evidence_opening"},"narrative":"재판보다 중요한 것은 그 재판에 제출할 원본이 남는 일이었다.","effects":[{"op":"addToSet","path":"flags","value":"route_evidence"}]}]},{"id":"gate_to_collective","text":"자신만이 아니라 다른 피해자들과 싸운다","outcomes":[{"id":"out_gate_to_collective","weight":1,"result":"mixed","to":{"kind":"node","id":"route_collective_opening"},"narrative":"당신의 사건을 한 사람의 비극으로 만들지 않기로 했다.","effects":[{"op":"addToSet","path":"flags","value":"route_collective"}]}]}],"chronicleSummary":"접수번호가 된 항의"},"gate_money":{"id":"gate_money","kind":"scene","age":21,"title":"예산서 가장 아래의 주석","body":"시험 출연료는 지급되지 않았다. 대신 왕실에서 초청장이 왔다. ‘국가 지정 위협 인물의 역할 재협의’. 당신은 마왕 역할이 나라에 얼마를 벌어 주었는지 궁금해졌다. 계약서를 스스로 만드는 삶과 장부를 조사해 국가를 바꾸는 삶 중 하나를 선택할 수 있었다.","choices":[{"id":"gate_to_business","text":"유료 마왕 토벌 체험을 사업으로 만든다","outcomes":[{"id":"out_gate_to_business","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_opening"},"narrative":"국가가 만든 역할을 처음으로 자신의 계약서에 적었다.","effects":[{"op":"addToSet","path":"flags","value":"route_business"}]}]},{"id":"gate_to_power","text":"왕국의 장부와 권력을 추적한다","outcomes":[{"id":"out_gate_to_power","weight":1,"result":"mixed","to":{"kind":"node","id":"route_power_opening"},"narrative":"당신을 괴물로 삼아 움직인 돈의 방향을 좇기로 했다.","effects":[{"op":"addToSet","path":"flags","value":"route_power"}]}]}],"chronicleSummary":"예산서 가장 아래의 주석"},"gate_mina":{"id":"gate_mina","kind":"scene","age":21,"title":"검을 내려놓은 뒤","body":"미나는 시험장에서 칼을 내려놓았다. 그녀가 용사 시험에서 합격할지는 알 수 없었다. 당신이 고백했기 때문도, 명령을 내렸기 때문도 아니었다. 그녀가 사람을 시험 문제로 대하지 않겠다고 스스로 결정했기 때문이다. 두 사람 앞에는 같이 사람을 구하는 삶과 서로의 마음을 정직하게 바라보는 삶이 있었다.","choices":[{"id":"gate_to_rescue","text":"미나와 함께 다른 사람을 구하는 길을 걷는다","outcomes":[{"id":"out_gate_to_rescue","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_opening"},"narrative":"미나의 자격증보다, 실제로 도움을 기다리는 사람을 먼저 보았다.","effects":[{"op":"addToSet","path":"flags","value":"route_rescue"}]}]},{"id":"gate_to_letters","text":"고백 뒤에도 미나의 선택을 기다린다","outcomes":[{"id":"out_gate_to_letters","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_opening"},"narrative":"사랑을 말했다고 답을 빚처럼 요구하지 않기로 했다.","effects":[{"op":"addToSet","path":"flags","value":"route_letters"}]}]}],"chronicleSummary":"검을 내려놓은 뒤"},"route_exile_opening":{"id":"route_exile_opening","kind":"scene","age":24,"title":"이름을 적는 국경","body":"변경 마을의 여관에 도착하자 주인은 숙박 장부를 내밀었다. ‘국가 지정 마왕’이라고 적는 순간 여관의 다른 손님들이 짐을 싸기 시작했다. 당신이 이름을 지웠다. 주인이 작은 소리로 말했다.\n\n“이쪽엔 이름이 없는 사람이 더 많아요. 국경을 넘다가 아이를 잃은 사람도 있고, 국경을 지키다가 직업을 잃은 사람도 있어요.”\n\n그날 밤, 누군가 밖에서 외쳤다. “마왕을 내놔라!” 주인은 뒷문 열쇠와 피난민 명단을 동시에 내밀었다. 어느 쪽도 가벼워 보이지 않았다.","choices":[{"id":"route_exile_open_1","text":"숙박 장부에 진짜 이름을 적고 주민을 보호한다.","outcomes":[{"id":"out_route_exile_open_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"exile_named"}]}]},{"id":"route_exile_open_2","text":"뒷문으로 나가 추적대를 다른 곳으로 유인한다.","outcomes":[{"id":"out_route_exile_open_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"exile_decoy"}]}]},{"id":"route_exile_open_3","text":"여관을 떠나 아이들의 신분 문제를 해결한다.","outcomes":[{"id":"out_route_exile_open_3","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_middle_b"},"narrative":"당신은 서류 밖에서 시작하는 문제를 택했다.","effects":[{"op":"addToSet","path":"flags","value":"exile_school"}]}]}],"chronicleSummary":"이름을 적는 국경"},"route_exile_middle_a":{"id":"route_exile_middle_a","kind":"scene","age":33,"title":"돌아오지 않는 길잡이","body":"당신은 피난민들의 마지막 이동 경로를 따라갔다. 길에는 사람이 아닌 서류가 쓰러져 있었다. 통행 허가증, 낙인 지시서, 서명 없는 사망 보고서.\n\n길잡이 이사는 말없이 지도를 펼쳤다. “이 길을 공개하면 군대도 따라올 거예요. 숨기면 다른 마을은 우리가 어디 있는지 몰라요.”\n\n전투력 2인 당신에게는 군대를 막을 힘이 없었다. 대신 지도를 그릴 손과, 남의 이름을 틀리지 않게 쓰는 버릇이 있었다.","choices":[{"id":"route_exile_middle_a_1","text":"지도를 공개해 누구나 길을 찾게 한다.","outcomes":[{"id":"out_route_exile_middle_a_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"exile_map_public"}]}]},{"id":"route_exile_middle_a_2","text":"길을 숨기고 주민에게만 지도를 나눈다.","outcomes":[{"id":"out_route_exile_middle_a_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"exile_map_secret"}]}]}],"chronicleSummary":"돌아오지 않는 길잡이"},"route_exile_middle_b":{"id":"route_exile_middle_b","kind":"scene","age":34,"title":"장부 바깥의 학교","body":"당신은 학교에 주민등록이 없다는 이유로 입학을 거절당한 아이들을 모았다. 선생님이 칠판에 ‘마왕’이라고 쓰자 아이 하나가 손을 들었다. “그거 직업이에요, 이름이에요?”\n\n당신은 답을 못 했다. 어느 날 교육감이 나타나 말했다. “학교를 인정하려면 아이들 이름을 왕국 명부에 올려야 합니다.”\n\n명부에 올리면 교육을 받는다. 동시에 쫓겨날 주소가 생긴다.","choices":[{"id":"route_exile_middle_b_1","text":"왕국 명부에 등록하고 교육권을 확보한다.","outcomes":[{"id":"out_route_exile_middle_b_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"exile_school_register"}]}]},{"id":"route_exile_middle_b_2","text":"무허가 학교를 지키며 대안을 만든다.","outcomes":[{"id":"out_route_exile_middle_b_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_exile_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"exile_school_free"}]}]}],"chronicleSummary":"장부 바깥의 학교"},"route_exile_final_a":{"id":"route_exile_final_a","kind":"scene","age":58,"title":"지도 끝에서 기다리는 사람들","body":"수십 년간 고쳐 그린 국경 지도 위에 새로운 선이 그어졌다. 두 왕국이 평화협정을 맺었지만 새 선은 마을을 둘로 잘랐다. 서류 속에서 당신은 여전히 ‘마왕’이었고, 협정문에는 사람의 이름이 없었다.\n\n이사가 마지막으로 물었다. “이번엔 지도를 누가 가질까요? 우리인가요, 권력을 가진 사람들인가요?”","choices":[{"id":"route_exile_final_a_1","text":"국경선을 주민에게 되돌리고 공동 관리한다.","outcomes":[{"id":"out_route_exile_final_a_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_exile_map"},"narrative":"당신은 지도 끝에 그은 이름의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"exile_map"}]}]},{"id":"route_exile_final_a_2","text":"평화협정 원본을 공개해 다시 협상하게 한다.","outcomes":[{"id":"out_route_exile_final_a_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_exile_treaty"},"narrative":"당신은 협정문의 공백의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"exile_treaty"}]}]}],"chronicleSummary":"지도 끝에서 기다리는 사람들","chronicle":[{"age":58,"text":"당신이 처음 여관 장부에 진짜 이름을 적었기에, 피난민들도 이름을 숨기지 않는 편지를 쓰기 시작했다.","when":{"op":"contains","path":"flags","value":"exile_named"}},{"age":58,"text":"추적대를 유인하다 생긴 흉터는 이후에도 날씨가 바뀔 때마다 아팠다. 주민들은 그날 밤의 위험을 잊지 않았다.","when":{"op":"contains","path":"flags","value":"exile_decoy"}},{"age":58,"text":"여관에서 떠나 학교를 택했던 결정 때문에, 나중의 지도에는 길보다 학교의 위치가 먼저 표시됐다.","when":{"op":"contains","path":"flags","value":"exile_school"}},{"age":58,"text":"공개했던 지도의 사본은 수많은 사람을 살렸지만 국경군의 감시도 함께 불러왔다.","when":{"op":"contains","path":"flags","value":"exile_map_public"}},{"age":58,"text":"지도를 숨겨 사람들을 지켰지만 도움을 요청하던 다른 마을에는 길을 알려줄 수 없었다.","when":{"op":"contains","path":"flags","value":"exile_map_secret"}}]},"route_exile_final_b":{"id":"route_exile_final_b","kind":"scene","age":60,"title":"교실에서 발견한 나라","body":"어린 시절의 이름 없는 아이들이 자라 교사가 되었다. 이제 왕국은 학교를 폐쇄하려 했다. 허가되지 않은 학교가 국가의 적을 길렀다는 이유였다.\n\n아이였던 교장이 말했다. “선생님, 우리에게 가르친 건 도망치는 법이 아니라 읽는 법이었어요.” 당신은 오래된 출석부를 펼쳤다. 한쪽에는 이름, 다른 쪽에는 각자의 꿈이 적혀 있었다.","choices":[{"id":"route_exile_final_b_1","text":"문을 열어두고 폐교 명령을 거부한다.","outcomes":[{"id":"out_route_exile_final_b_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_exile_class"},"narrative":"당신은 칠판 밖의 나라의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"exile_class"}]}]},{"id":"route_exile_final_b_2","text":"아이들을 안전하게 다른 곳으로 보낸다.","outcomes":[{"id":"out_route_exile_final_b_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_exile_diaspora"},"narrative":"당신은 이름 없는 졸업식의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"exile_diaspora"}]}]}],"chronicleSummary":"교실에서 발견한 나라","chronicle":[{"age":60,"text":"당신이 처음 여관 장부에 진짜 이름을 적었기에, 피난민들도 이름을 숨기지 않는 편지를 쓰기 시작했다.","when":{"op":"contains","path":"flags","value":"exile_named"}},{"age":60,"text":"추적대를 유인하다 생긴 흉터는 이후에도 날씨가 바뀔 때마다 아팠다. 주민들은 그날 밤의 위험을 잊지 않았다.","when":{"op":"contains","path":"flags","value":"exile_decoy"}},{"age":60,"text":"여관에서 떠나 학교를 택했던 결정 때문에, 나중의 지도에는 길보다 학교의 위치가 먼저 표시됐다.","when":{"op":"contains","path":"flags","value":"exile_school"}},{"age":60,"text":"공개했던 지도의 사본은 수많은 사람을 살렸지만 국경군의 감시도 함께 불러왔다.","when":{"op":"contains","path":"flags","value":"exile_map_public"}},{"age":60,"text":"지도를 숨겨 사람들을 지켰지만 도움을 요청하던 다른 마을에는 길을 알려줄 수 없었다.","when":{"op":"contains","path":"flags","value":"exile_map_secret"}}]},"route_resistance_opening":{"id":"route_resistance_opening","kind":"scene","age":24,"title":"빈 검집의 동맹","body":"왕국은 당신에게 ‘마왕 부하 모집 혐의’를 적용했다. 함께 억울함을 호소한 사람들까지 군법회의에 넘기려 했다. 당신을 찾아온 퇴역 병사들은 무기를 가져왔고, 빵집 주인은 도장을 가져왔다.\n\n“성을 공격합시다.” 병사가 말했다. “아니, 공개서명을 모읍시다.” 빵집 주인이 말했다. 당신은 병사의 칼을 들어 보려다 발등에 떨어뜨렸다.\n\n결국 모두가 당신의 선택을 기다렸다. 이번에는 시험 감독관도 없었다.","choices":[{"id":"route_resistance_open_1","text":"무기 반입을 금하고 비폭력 대열을 훈련한다.","outcomes":[{"id":"out_route_resistance_open_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"resist_nonviolent"}]}]},{"id":"route_resistance_open_2","text":"책임자를 직접 설득할 시민 대표를 뽑는다.","outcomes":[{"id":"out_route_resistance_open_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"resist_dialogue"}]}]},{"id":"route_resistance_open_3","text":"전단 제작의 돈줄을 추적한다.","outcomes":[{"id":"out_route_resistance_open_3","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_middle_b"},"narrative":"당신은 서류 밖에서 시작하는 문제를 택했다.","effects":[{"op":"addToSet","path":"flags","value":"resist_press"}]}]}],"chronicleSummary":"빈 검집의 동맹"},"route_resistance_middle_a":{"id":"route_resistance_middle_a","kind":"scene","age":35,"title":"칼을 들지 않은 대열","body":"밤에 훈련하던 사람들이 새벽에 함께 걸었다. 수비대는 군중을 향해 창을 들었고, 당신의 동료들은 방패에 화살 대신 쪽지를 꽂았다. ‘세금 냈음. 체포 이유를 적어 주시오.’\n\n지휘관이 당신에게 물었다. “대열을 해산시키면 잡아가지 않겠다.” 말은 쉬웠다. 앞줄에 서 있는 사람들은 당신의 명령으로 모인 사람들이었다.","choices":[{"id":"route_resistance_middle_a_1","text":"사람들을 남기되 모든 행동을 기록한다.","outcomes":[{"id":"out_route_resistance_middle_a_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"resist_march"}]}]},{"id":"route_resistance_middle_a_2","text":"사람들을 해산시키고 각자 동네에서 이어간다.","outcomes":[{"id":"out_route_resistance_middle_a_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"resist_scatter"}]}]}],"chronicleSummary":"칼을 들지 않은 대열"},"route_resistance_middle_b":{"id":"route_resistance_middle_b","kind":"scene","age":34,"title":"왕국의 적을 만드는 인쇄소","body":"당신은 마왕 수배 전단을 찍던 인쇄소를 찾아냈다. 전단 뒤편에는 왕국의 납품 명세가 함께 인쇄돼 있었다. 인쇄공이 말했다. “당신 얼굴이 팔리면 우리 식구가 먹고살아요.”\n\n그는 다음 전단을 주문받았다. 이번에는 당신이 어린이를 납치했다고 적으라는 지시였다. 거짓을 밝힐 증거를 가져가면 인쇄소는 문을 닫을 것이다.","choices":[{"id":"route_resistance_middle_b_1","text":"원본 인쇄판을 안전하게 보관한다.","outcomes":[{"id":"out_route_resistance_middle_b_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"resist_plate"}]}]},{"id":"route_resistance_middle_b_2","text":"인쇄공에게 공개 증언 여부를 선택하게 한다.","outcomes":[{"id":"out_route_resistance_middle_b_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_resistance_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"resist_printer"}]}]}],"chronicleSummary":"왕국의 적을 만드는 인쇄소"},"route_resistance_final_a":{"id":"route_resistance_final_a","kind":"scene","age":59,"title":"창문을 연 행진","body":"광장에 모인 사람들은 늙었다. 누군가는 손목이 불편했고 누군가는 더 이상 멀리 걷지 못했다. 그러나 새로 온 아이들은 그들이 왜 걷는지 알고 있었다.\n\n새 법령은 집회에 ‘안전을 위한 허가’를 요구했다. 사람들은 당신을 앞줄로 밀었다. 앞줄에 서면 명령할 수 있고, 맨 뒤에 서면 누구도 보이지 않았다.","choices":[{"id":"route_resistance_final_a_1","text":"앞줄에 서서 집회 금지 명령을 거부한다.","outcomes":[{"id":"out_route_resistance_final_a_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_resistance_march"},"narrative":"당신은 칼 없는 반란의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"resistance_march"}]}]},{"id":"route_resistance_final_a_2","text":"대열을 여러 마을의 시민 모임으로 나눈다.","outcomes":[{"id":"out_route_resistance_final_a_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_resistance_network"},"narrative":"당신은 창문마다 켜진 불의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"resistance_network"}]}]}],"chronicleSummary":"창문을 연 행진","chronicle":[{"age":59,"text":"처음에 무기를 내려놓기로 한 약속이야말로 군중이 당신을 믿은 이유였다.","when":{"op":"contains","path":"flags","value":"resist_nonviolent"}},{"age":59,"text":"시민 대표를 세운 뒤 당신 혼자의 말보다 여러 사람이 직접 한 증언이 오래 남았다.","when":{"op":"contains","path":"flags","value":"resist_dialogue"}},{"age":59,"text":"인쇄소의 돈줄을 찾는 동안 뜻밖에도 당신의 얼굴로 생계를 잇던 사람들을 만나야 했다.","when":{"op":"contains","path":"flags","value":"resist_press"}},{"age":59,"text":"당신이 앞줄을 지키면서도 군중의 퇴로를 열어 둔 선택은 끝내 폭력을 막는 단서가 됐다.","when":{"op":"contains","path":"flags","value":"resist_march"}},{"age":59,"text":"보관했던 인쇄판에는 국가의 거짓말이 손으로 만질 수 있을 만큼 선명하게 새겨져 있었다.","when":{"op":"contains","path":"flags","value":"resist_plate"}}]},"route_resistance_final_b":{"id":"route_resistance_final_b","kind":"scene","age":57,"title":"마지막 인쇄판","body":"인쇄소는 파산했지만 거짓 수배 전단을 만들던 납품 원장은 남았다. 원장에 이름을 남긴 사람 중 하나가 지금의 내무장관이었다. 그는 고백했다. “반역을 꾸며낸 건 사실이지만, 질서가 무너질까 두려웠소.”\n\n그를 감옥에 보내는 순간 당신은 국가가 가장 원하던 ‘진짜 적’이 될 수도 있었다.","choices":[{"id":"route_resistance_final_b_1","text":"장관의 자백과 원장을 법정에 제출한다.","outcomes":[{"id":"out_route_resistance_final_b_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_resistance_confess"},"narrative":"당신은 범죄를 기록한 활자의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"resistance_confess"}]}]},{"id":"route_resistance_final_b_2","text":"인쇄공과 장관을 공개 토론에 불러낸다.","outcomes":[{"id":"out_route_resistance_final_b_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_resis _named"}]}]}],"chronicleSummary":"증인의 마지막 출근"},"route_evidence_final_a":{"id":"route_evidence_final_a","kind":"scene","age":60,"title":"공개되지 않은 열세 번째 쪽","body":"재판장은 문서를 읽다가 마지막 한 장을 뒤집었다. 그쪽에는 왕실 지시를 받아들이지 않은 어느 하급 관리의 메모가 있었다. “아이가 거부할 수 있는 절차가 먼저입니다.”\n\n왕국은 그 관리에게 훈장을 주겠다고 했다. 당신은 그가 해고된 날짜를 알고 있었다. 명예는 뒤늦게 도착했지만 그의 자리는 돌아오지 않았다.","choices":[{"id":"route_evidence_final_a_1","text":"판결보다 먼저 강제 지정 제도를 멈추게 한다.","outcomes":[{"id":"out_route_evidence_final_a_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_evidence_injunction"},"narrative":"당신은 빈칸이 된 직업의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"evidence_injunction"}]}]},{"id":"route_evidence_final_a_2","text":"재판 과정 전부를 공개 기록으로 남긴다.","outcomes":[{"id":"out_route_evidence_final_a_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_evidence_archive"},"narrative":"당신은 열세 번째 쪽의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"evidence_archive"}]}]}],"chronicleSummary":"공개되지 않은 열세 번째 쪽","chronicle":[{"age":60,"text":"처음부터 작성한 봉인 인계 기록이 마지막 재판에서 원본의 신빙성을 지켰다.","when":{"op":"contains","path":"flags","value":"evidence_chain"}},{"age":60,"text":"공증인과 입회인이 남긴 서명이 국가가 문서를 부정하는 일을 어렵게 만들었다.","when":{"op":"contains","path":"flags","value":"evidence_witnesses"}},{"age":60,"text":"서기관 가족을 먼저 보호하기로 한 결정은 절차를 늦췄지만 사람을 잃지 않게 했다.","when":{"op":"contains","path":"flags","value":"evidence_protect"}},{"age":60,"text":"문서의 진위를 먼저 검증한 덕분에 왕실의 거짓 감정서는 쉽게 힘을 얻지 못했다.","when":{"op":"contains","path":"flags","value":"evidence_auth"}},{"age":60,"text":"증언자의 신원을 분리한 서류는 기록으로 남았고, 누군가의 가족은 비로소 집으로 돌아갈 수 있었다.","when":{"op":"contains","path":"flags","value":"evidence_anonym"}}]},"route_evidence_final_b":{"id":"route_evidence_final_b","kind":"scene","age":59,"title":"증인이 없는 법정","body":"서기관은 법정에 나오지 못했다. 세상을 떠난 뒤였다. 대신 그의 자녀가 오래된 일기와 함께 증언대에 섰다. 판사는 죽은 사람의 말은 증거로 쓰기 어렵다고 했다.\n\n“살아 있을 때는 듣지 않더니, 이제는 너무 늦었다고 하네요.” 자녀의 목소리가 떨렸다. 당신은 손에 든 문서가 사람보다 오래 산다는 사실이 미워졌다.","choices":[{"id":"route_evidence_final_b_1","text":"증인의 가족을 보호할 기금을 만든다.","outcomes":[{"id":"out_route_evidence_final_b_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_evidence_witness"},"narrative":"당신은 증인이 살던 집의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"evidence_witness"}]}]},{"id":"route_evidence_final_b_2","text":"기억을 공적 기록으로 인정받는 소송을 이어간다.","outcomes":[{"id":"out_route_evidence_final_b_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_evidence_memory"},"narrative":"당신은 서류보다 오래 남은 목소리의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"evidence_memory"}]}]}],"chronicleSummary":"증인이 없는 법정","chronicle":[{"age":59,"text":"처음부터 작성한 봉인 인계 기록이 마지막 재판에서 원본의 신빙성을 지켰다.","when":{"op":"contains","path":"flags","value":"evidence_chain"}},{"age":59,"text":"공증인과 입회인이 남긴 서명이 국가가 문서를 부정하는 일을 어렵게 만들었다.","when":{"op":"contains","path":"flags","value":"evidence_witnesses"}},{"age":59,"text":"서기관 가족을 먼저 보호하기로 한 결정은 절차를 늦췄지만 사람을 잃지 않게 했다.","when":{"op":"contains","path":"flags","value":"evidence_protect"}},{"age":59,"text":"문서의 진위를 먼저 검증한 덕분에 왕실의 거짓 감정서는 쉽게 힘을 얻지 못했다.","when":{"op":"contains","path":"flags","value":"evidence_auth"}},{"age":59,"text":"증언자의 신원을 분리한 서류는 기록으로 남았고, 누군가의 가족은 비로소 집으로 돌아갈 수 있었다.","when":{"op":"contains","path":"flags","value":"evidence_anonym"}}]},"route_collective_opening":{"id":"route_collective_opening","kind":"scene","age":25,"title":"원고가 너무 많은 재판","body":"당신이 소송을 접수하러 갔을 때, 출생신고 직업란 때문에 삶이 어긋난 사람이 일흔세 명이나 기다리고 있었다. ‘예언의 제물’인 소녀, ‘세금 면제 대상’이라 학교에 가지 못한 아이, ‘영원한 적군’이라 숙박을 거절당한 노인.\n\n사무관은 신청서 상단을 가리켰다. “공동 소송은 대표 원고 한 명만 받습니다.”\n\n일흔세 명이 동시에 당신을 보았다. 대표가 되는 순간 나머지는 당신 뒤에 가려질 수 있었다.","choices":[{"id":"route_collective_open_1","text":"다른 피해자들의 피해액을 함께 조사한다.","outcomes":[{"id":"out_route_collective_open_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_collective_middle_a"},"narrative when":{"op":"contains","path":"flags","value":"collective_priority"}},{"age":62,"text":"서명을 거부한 아이의 의견을 지운 적이 없었기에 마지막 수정 조항에는 예외를 둘 수 없었다.","when":{"op":"contains","path":"flags","value":"collective_child"}}]},"route_business_opening":{"id":"route_business_opening","kind":"scene","age":25,"title":"오늘의 마왕은 예약제","body":"용사 지망생들이 당신 앞에 줄을 섰다. 누구도 마왕을 실제로 본 적은 없지만 모두 마왕을 쓰러뜨리는 증명서가 필요했다. 당신은 가격표를 붙였다. ‘상처 없는 토벌 체험. 승리 보장 아님. 다치는 건 본인 책임.’\n\n첫 손님은 검을 너무 힘껏 휘둘러 자기 신발을 찢었다. 미나가 와서 표지판을 읽고 말했다. “책임은 그런 문장 하나로 없앨 수 없어.”\n\n당신이 그녀를 보았다. “내가 이 나라에서 처음으로 계약서를 읽는 마왕이 됐는데?”","choices":[{"id":"route_business_open_1","text":"미나와 안전 수칙을 만들어 체험장을 연다.","outcomes":[{"id":"out_route_business_open_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"business_safety"}]}]},{"id":"route_business_open_2","text":"손님에게 비용과 위험을 모두 공개한다.","outcomes":[{"id":"out_route_business_open_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"business_transparency"}]}]},{"id":"route_business_open_3","text":"배우들과 극장형 토벌 공연을 만든다.","outcomes":[{"id":"out_route_business_open_3","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_middle_b"},"narrative":"당신은 서류 밖에서 시작하는 문제를 택했다.","effects":[{"op":"addToSet","path":"flags","value":"business_theatre"}]}]}],"chronicleSummary":"오늘의 마왕은 예약제"},"route_business_middle_a":{"id":"route_business_middle_a","kind":"scene","age":36,"title":"안전 규정이 먼저인 사업","body":"당신의 체험장은 잘나갔다. 손님은 다치지 않았고, 왕국은 위험한 기술을 가르치지 않는다는 이유로 ‘용사 인증’을 거부했다. 심사관이 말했다. “진짜 용사는 위험을 감수해야 합니다.”\n\n미나는 반박했다. “위험을 감수하는 것과 남에게 떠넘기는 건 다르죠.” 왕국은 당신에게 안전 규정을 삭제하면 영업 허가를 내주겠다고 제안했다.","choices":[{"id":"route_business_middle_a_1","text":"자격증 대신 실제 교육 성과를 공개한다.","outcomes":[{"id":"out_route_business_middle_a_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"business_outcome"}]}]},{"id":"route_business_middle_a_2","text":"민간 안전 인증 제도를 만든다.","outcomes":[{"id":"out_route_business_middle_a_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"business_certificate"}]}]}],"chronicleSummary":"안전 규정이 먼저인 사업"},"route_business_middle_b":{"id":"route_business_middle_b","kind":"scene","age":37,"title":"마왕을 팔던 극장","body":"당신은 토벌 체험을 연극으로 만들었다. 관객은 마왕을 더 위험하게 보이도록 요구했고, 배우들은 얼굴에 상처 분장을 했다. 흥행은 대성공이었다.\n\n한 아이가 공연 후 물었다. “진짜 마왕은 저렇게 소리 질러요?” 당신은 대답하려다 멈췄다. 당신의 얼굴을 한 악역이 아이에게 공포의 기준이 되고 있었다.","choices":[{"id":"route_business_middle_b_1","text":"이야기가 허구임을 공연마다 밝힌다.","outcomes":[{"id":"out_route_business_middle_b_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"business_fiction"}]}]},{"id":"route_business_middle_b_2","text":"흥행을 위해 마왕의 공포를 더 과장한다.","outcomes":[{"id":"out_route_business_middle_b_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_business_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"business_hype"}]}]}],"chronicleSummary":"마왕을 팔던 극장"},"route_business_final_a":{"id":"route_business_final_a","kind":"scene","age":62,"title":"가장 조용한 용사 시험장","body":"당신의 안전 수칙은 많은 체험장으로 퍼졌다. 더 이상 손님이 당신을 쓰러뜨리는 사진을 찍지 않아도 장사는 됐다. 그런데 왕국은 새로 배출한 용사들의 실력을 인정하지 않았다. “시련의 강도가 부족하다”는 이유였다.\n\n미나는 제자들을 데리고 찾아왔다. “인증서가 필요해. 하지만 네 규정을 없애면 안 돼.” 당신이 할 수 있는 건 마지막으로 계약서를 고치는 일이었다.","choices":[{"id":"route_business_final_a_1","text":"정부 인증 없이 안전한 교육 사업을 지속한다.","outcomes":[{"id":"out_route_business_final_a_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_business_safety"},"narrative":"당신은 합격하지  사실만으로 참여가 가능해지지는 않아요. 다음에 뭘 해야 할까요?”","choices":[{"id":"route_power_final_b_1","text":"시민이 직접 참여할 수 있는 시간을 보장한다.","outcomes":[{"id":"out_route_power_final_b_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_power_democracy"},"narrative":"당신은 왕관 없는 회계장부의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"power_democracy"}]}]},{"id":"route_power_final_b_2","text":"직접 관찰 가능한 소액 예산부터 투표한다.","outcomes":[{"id":"out_route_power_final_b_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_power_small"},"narrative":"당신은 왕국 최초의 예산 수업의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"power_small"}]}]}],"chronicleSummary":"왕관보다 무거운 장부","chronicle":[{"age":60,"text":"세렌과 함께 실물 자료를 대조했기에 장부의 숫자와 사법적 판단을 구분할 수 있었다.","when":{"op":"contains","path":"flags","value":"power_audit"}},{"age":60,"text":"원본을 공개하는 절차부터 만들었던 덕분에 당신이 사라져도 다른 사람이 검증을 이어갔다.","when":{"op":"contains","path":"flags","value":"power_disclose"}},{"age":60,"text":"주민 예산 회의를 설계한 때부터 왕실의 장부는 처음으로 사람들의 질문을 받기 시작했다.","when":{"op":"contains","path":"flags","value":"power_council"}},{"age":60,"text":"확인되지 않은 지출을 횡령이라 말하지 않은 선택이 세렌의 증언에 힘을 주었다.","when":{"op":"contains","path":"flags","value":"power_precise"}},{"age":60,"text":"지방 회의부터 시작했기에 숫자를 읽는 시민들이 작은 마을에서도 나왔다.","when":{"op":"contains","path":"flags","value":"power_local"}}]},"route_rescue_opening":{"id":"route_rescue_opening","kind":"scene","age":24,"title":"합격하지 못한 용사의 첫 구조","body":"미나는 시험장에서 당신을 제압하는 것을 거부했다. 자격증 심사는 보류되었다. 그러나 강물이 범람하자 그녀는 아무도 부르지 않았는데도 가장 먼저 다리로 달려갔다.\n\n당신은 밧줄을 들고 뒤따랐다. 주민이 물었다. “마왕이 구조대에 있으면 안전합니까?”\n\n“안전은 제 이름이 아니라 저 밧줄에 달렸어요.” 당신이 말했다. 미나는 젖은 머리카락을 쓸어 넘기며 웃지 않았다. 물속에 아직 사람이 있었기 때문이다.","choices":[{"id":"route_rescue_open_1","text":"당장 구호소를 열어 응급 지원을 맡는다.","outcomes":[{"id":"out_route_rescue_open_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_clinic"}]}]},{"id":"route_rescue_open_2","text":"구호소 재정 기록을 공개하고 후원을 받는다.","outcomes":[{"id":"out_route_rescue_open_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_accounts"}]}]},{"id":"route_rescue_open_3","text":"마을마다 독립 구조대를 훈련시킨다.","outcomes":[{"id":"out_route_rescue_open_3","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_middle_b"},"narrative":"당신은 서류 밖에서 시작하는 문제를 택했다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_training"}]}]}],"chronicleSummary":"합격하지 못한 용사의 첫 구조"},"route_rescue_middle_a":{"id":"route_rescue_middle_a","kind":"scene","age":34,"title":"구호소의 두 개 장부","body":"미나는 치료받은 사람의 이름을 적었고, 당신은 필요한 물품을 적었다. 한 장부에는 감사가 쌓였고 다른 장부에는 빚이 쌓였다. 왕실은 구호소를 지원하겠다고 했다. 조건은 ‘국가 지정 마왕 근절’이라는 현판을 달라는 것이었다.\n\n미나가 물었다. “네 얼굴이 있는 현판 밑에서 널 일하게 하라는 거야?”\n\n구호소를 지킬 돈이 필요했다. 사람들에게는 이름보다 치료가 급했다.","choices":[{"id":"route_rescue_middle_a_1","text":"현판 없는 조건으로 정부 지원을 협상한다.","outcomes":[{"id":"out_route_rescue_middle_a_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_negotiation"}]}]},{"id":"route_rescue_middle_a_2","text":"시민 후원을 받고 독립 운영을 유지한다.","outcomes":[{"id":"out_route_rescue_middle_a_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_community"}]}]}],"chronicleSummary":"구호소의 두 개 장부"},"route_rescue_middle_b":{"id":"route_rescue_middle_b","kind":"scene","age":35,"title":"서로 다른 길의 지도","body":"미나는 여러 마을의 구조대를 훈련시키고, 당신은 안전한 이송로를 만드는 일을 맡았다. 오랫동안 함께 걷다가 서로 다른 방향으로 가야 하는 날이 왔다.\n\n“내가 널 구한 사람이라고 기억되기 싫어.” 미나가 말했다. “너도 남을 구할 수 있다는 걸 사람들이 알아야 해.”\n\n당신은 출발하기 전 그녀에게 나무칼 손잡이를 건넸다. 둘 다 이미 어린아이가 아니었다.","choices":[{"id":"route_rescue_middle_b_1","text":"각 마을이 독자적으로 구조대를 운영하게 한다.","outcomes":[{"id":"out_route_rescue_middle_b_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_decentral"}]}]},{"id":"route_rescue_middle_b_2","text":"미나의 훈련법을 공개 교본으로 남긴다.","outcomes":[{"id":"out_route_rescue_middle_b_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_rescue_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_manual"}]}]}],"chronicleSummary":"서로 다른 길의 지도"},"route_rescue_final_a":{"id":"route_rescue_final_a","kind":"scene","age":60,"title":"마지막으로 닫히는 구호소","body":"구호소는 처음보다 커졌고 미나는 전보다 천천히 걸었다. 왕국은 마침내 정식 구조대 면허를 주겠다고 했다. 조건은 구호소 운영권을 군에 넘기는 것이었다.\n\n환자들은 안정적인 지원을 원했다. 미나는 군인들에게 나쁜 감정이 없었다. 그러나 도움받는 사람을 시험 문제처럼 다루던 규정이 다시 돌아올 수 있었다.","choices":[{"id":"route_rescue_final_a_1","text":"환자 의견을 모아 운영권을 시민에게 넘긴다.","outcomes":[{"id":"out_route_rescue_final_a_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_rescue_patients"},"narrative":"당신은 용사가 열어둔 문의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_patients"}]}]},{"id":"route_rescue_final_a_2","text":"군과 협약하되 환자의 선택권을 문서로 보장한다.","outcomes":[{"id":"out_route_rescue_final_a_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_rescue_accord"},"narrative":"당신은 갑옷 밖의 약속의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_accord"}]}]}],"chronicleSummary":"마지막으로 닫히는 구호소","chronicle":[{"age":60,"text":"첫 홍수 때 열었던 작은 구호소가 결국 왕국에서 가장 믿을 만한 의료 공간이 됐다.","when":{"op":"contains","path":"flags","value":"rescue_clinic"}},{"age":60,"text":"재정 공개를 고집했던 덕분에 지원을 받으면서도 운영을 감시받을 준비가 되어 있었다.","when":{"op":"contains","path":"flags","value":"rescue_accounts"}},{"age":60,"text":"미나 혼자가 아니라 여러 마을을 훈련시킨 결과, 그녀가 없는 날에도 구조는 이어졌다.","when":{"op":"contains","path":"flags","value":"rescue_training"}},{"age":60,"text":"정당한 조건을 놓고 협상해 온 경험이 마지막 지원 계약에서 빛났다.","when":{"op":"contains","path":"flags","value":"rescue_negotiation"}},{"age":60,"text":"각 마을에 운영권을 나눠 준 결정 덕분에 구조대는 유명한 한 사람에게 매달리지 않았다.","when":{"op":"contains","path":"flags","value":"rescue_decentral"}}]},"route_rescue_final_b":{"id":"route_rescue_final_b","kind":"scene","age":61,"title":"검을 맡길 사람","body":"미나는 낡은 검을 내려놓았다. 왕국은 그녀의 퇴역식을 크게 열고 싶어 했다. 그러나 미나는 자신 대신 구조대에서 일했던 사람들의 이름을 부르고 싶어 했다.\n\n당신에게는 두 가지 초대장이 왔다. 하나는 왕궁의 영웅 연회, 하나는 먼 마을의 작은 졸업식이었다. 어느 쪽에도 가야 할 이유가 있었다.","choices":[{"id":"route_rescue_final_b_1","text":"마을 졸업식에 가서 구조대의 이름을 부른다.","outcomes":[{"id":"out_route_rescue_final_b_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_rescue_graduation"},"narrative":"당신은 누구나 배울 수 있는 용기의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_graduation"}]}]},{"id":"route_rescue_final_b_2","text":"왕궁 연회에서 미나가 원한 이름들을 읽는다.","outcomes":[{"id":"out_route_rescue_final_b_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_rescue_speech"},"narrative":"당신은 한 명도 빠뜨리지 않는 영웅의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"rescue_speech"}]}]}],"chronicleSummary":"검을 맡길 사람","chronicle":[{"age":61,"text":"첫 홍수 때 열었던 작은 구호소가 결국 왕국에서 가장 믿을 만한 의료 공간이 됐다.","when":{"op":"contains","path":"flags","value":"rescue_clinic"}},{"age":61,"text":"재정 공개를 고집했던 덕분에 지원을 받으면서도 운영을 감시받을 준비가 되어 있었다.","when":{"op":"contains","path":"flags","value":"rescue_accounts"}},{"age":61,"text":"미나 혼자가 아니라 여러 마을을 훈련시킨 결과, 그녀가 없는 날에도 구조는 이어졌다.","when":{"op":"contains","path":"flags","value":"rescue_training"}},{"age":61,"text":"정당한 조건을 놓고 협상해 온 경험이 마지막 지원 계약에서 빛났다.","when":{"op":"contains","path":"flags","value":"rescue_negotiation"}},{"age":61,"text":"각 마을에 운영권을 나눠 준 결정 덕분에 구조대는 유명한 한 사람에게 매달리지 않았다.","when":{"op":"contains","path":"flags","value":"rescue_decentral"}}]},"route_letters_opening":{"id":"route_letters_opening","kind":"scene","age":24,"title":"보내지 않은 답장","body":"스무 살 시험장에서 당신은 미나에게 칼을 내려놓아 달라고 부탁했다. 스물한 살, 당신은 그녀가 무엇을 선택하든 존중하겠다고 말한 뒤 좋아한다는 마음을 전했다. 미나는 당장 대답하지 않았다. 그녀는 시험을 거부할지, 어떤 사람이 될지 먼저 결정해야 했다.\n\n그 뒤로 몇 년간 두 사람은 편지를 주고받았다. 당신은 검 연습 이야기를 읽었고, 미나는 당신의 황당한 행정 민원을 읽었다.\n\n어느 날 미나는 편지 끝에 썼다. “나를 기다리는 일이 네 인생을 전부 차지하지 않았으면 좋겠어.”","choices":[{"id":"route_letters_open_1","text":"고백을 반복하지 않고 서로의 근황을 나눈다.","outcomes":[{"id":"out_route_letters_open_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"letters_respect"}]}]},{"id":"route_letters_open_2","text":"친구로 만나며 서로의 계획을 묻는다.","outcomes":[{"id":"out_route_letters_open_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_middle_a"},"narrative":"당신은 이 문제의 현장으로 걸어 들어갔다.","effects":[{"op":"addToSet","path":"flags","value":"letters_friendship"}]}]},{"id":"route_letters_open_3","text":"서로 독립적으로 살면서 느슨하게 연락한다.","outcomes":[{"id":"out_route_letters_open_3","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_middle_b"},"narrative":"당신은 서류 밖에서 시작하는 문제를 택했다.","effects":[{"op":"addToSet","path":"flags","value":"letters_distance"}]}]}],"chronicleSummary":"보내지 않은 답장"},"route_letters_middle_a":{"id":"route_letters_middle_a","kind":"scene","age":35,"title":"재회와 두 개의 삶","body":"당신은 새 직장에서 자리를 잡았고 미나는 긴 여행을 마치고 돌아왔다. 둘은 오랜만에 강둑을 걸었다. 미나가 조심스럽게 물었다. “우리가 서로에게 어떤 사람이었으면 좋겠어?”\n\n당신은 이제 고백할 수 있었다. 그러나 이번에는 상대의 대답을 기다릴 준비가 되어 있었다. 강물은 지난번과 같이 흐르지 않았다.","choices":[{"id":"route_letters_middle_a_1","text":"자신의 삶도 계속하며 미나와 솔직하게 대화한다.","outcomes":[{"id":"out_route_letters_middle_a_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"letters_ownlife"}]}]},{"id":"route_letters_middle_a_2","text":"미나의 의견을 듣고 공동 생활 가능성을 탐색한다.","outcomes":[{"id":"out_route_letters_middle_a_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_final_a"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"letters_mutual"}]}]}],"chronicleSummary":"재회와 두 개의 삶"},"route_letters_middle_b":{"id":"route_letters_middle_b","kind":"scene","age":34,"title":"대답하지 않아도 되는 관계","body":"미나는 다른 도시에서 일했고 당신도 그곳에 살지 않았다. 편지가 도착하는 간격은 길어졌다. 가끔 서로에게 마음을 묻는 대신 지붕을 수리했는지, 감기에서 나았는지를 물었다.\n\n친구가 말했다. “아직 답을 못 받았어?”\n\n당신은 친구를 보았다. “그 사람의 삶이 시험 문제는 아니잖아.”","choices":[{"id":"route_letters_middle_b_1","text":"대답을 재촉하지 않는 편지를 쓴다.","outcomes":[{"id":"out_route_letters_middle_b_1","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"letters_no_pressure"}]}]},{"id":"route_letters_middle_b_2","text":"서로 원할 때만 연락하자는 약속을 남긴다.","outcomes":[{"id":"out_route_letters_middle_b_2","weight":1,"result":"mixed","to":{"kind":"node","id":"route_letters_final_b"},"narrative":"그때의 결정은 훗날 마지막 선택을 앞두고 다시 떠올랐다.","effects":[{"op":"addToSet","path":"flags","value":"letters_space"}]}]}],"chronicleSummary":"대답하지 않아도 되는 관계"},"route_letters_final_a":{"id":"route_letters_final_a","kind":"scene","age":59,"title":"서로의 문을 두드린 저녁","body":"두 사람이 수십 년간 쌓은 것은 낡은 약속보다 함께 해낸 결정들이었다. 미나는 당신의 일을 존중했고, 당신은 미나의 길을 막지 않았다.\n\n미나가 어느 저녁 말했다. “나는 이제 너와 같이 살고 싶어. 내가 원하는 일이야.”\n\n당신은 오래전에 쓰던 고백 문장을 꺼내지 않았다. 이번에는 서로의 생활과 책임을 먼저 이야기해야 했다.","choices":[{"id":"route_letters_final_a_1","text":"상호 합의한 생활과 관계를 공적으로 약속한다.","outcomes":[{"id":"out_route_letters_final_a_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_letters_together"},"narrative":"당신은 선택한 두 사람의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"letters_together"}]}]},{"id":"route_letters_final_a_2","text":"각자의 집을 유지하면서 서로의 동반자가 된다.","outcomes":[{"id":"out_route_letters_final_a_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_letters_partners"},"narrative":"당신은 두 개의 집, 한 개의 약속의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"letters_partners"}]}]}],"chronicleSummary":"서로의 문을 두드린 저녁","chronicle":[{"age":59,"text":"첫 편지부터 답을 재촉하지 않은 태도는 두 사람이 다시 만났을 때에도 남아 있었다.","when":{"op":"contains","path":"flags","value":"letters_respect"}},{"age":59,"text":"친구로 지내며 서로의 계획을 물었던 시간은 사랑의 여부와 별개로 귀중했다.","when":{"op":"contains","path":"flags","value":"letters_friendship"}},{"age":59,"text":"서로의 공간을 지킨 덕분에 멀리 떨어져 있는 시간도 무의미하지 않았다.","when":{"op":"contains","path":"flags","value":"letters_distance"}},{"age":59,"text":"미나를 기다리면서도 자신의 생활을 지켰기에 당신은 대답에 자신을 전부 걸지 않았다.","when":{"op":"contains","path":"flags","value":"letters_ownlife"}},{"age":59,"text":"대답을 재촉하지 않는 편지는 결국 누가 누구의 삶을 대신 결정할 수 없다는 약속이 되었다.","when":{"op":"contains","path":"flags","value":"letters_no_pressure"}}]},"route_letters_final_b":{"id":"route_letters_final_b","kind":"scene","age":61,"title":"강둑의 작은 벤치","body":"답장은 더 이상 자주 오지 않았다. 당신은 자신을 기다리게 했던 사람이 아니라, 함께 살아 본 시간이 있는 친구로 미나를 기억했다.\n\n오래된 벤치에 앉았을 때 누군가 그녀가 행복했느냐고 물었다. 당신은 다 알 수 없다고 대답했다. 대신 그녀가 직접 고른 삶을 존중하려 노력했다고 말했다.","choices":[{"id":"route_letters_final_b_1","text":"전하지 못한 감정을 편지에 남기고 보내지 않는다.","outcomes":[{"id":"out_route_letters_final_b_1","weight":1,"result":"success","to":{"kind":"ending","id":"end_letters_unsent"},"narrative":"당신은 보내지 않은 마지막 편지의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"letters_unsent"}]}]},{"id":"route_letters_final_b_2","text":"미나에게 감사만 전하고 자신의 다음 길을 걷는다.","outcomes":[{"id":"out_route_letters_final_b_2","weight":1,"result":"mixed","to":{"kind":"ending","id":"end_letters_thanks"},"narrative":"당신은 대답 대신 남긴 인사의 길을 택했다. 돌아갈 수 없는 선택이었지만 누군가 대신한 결정은 아니었다.","effects":[{"op":"addToSet","path":"flags","value":"letters_thanks"}]}]}],"chronicleSummary":"강둑의 작은 벤치","chronicle":[{"age":61,"text":"첫 편지부터 답을 재촉하지 않은 태도는 두 사람이 다시 만났을 되었다. 사람들이 당신을 구하러 성문을 부수지는 않았다. 대신 같은 양식의 체포 사유 공개 청구를 며칠이고 내밀었다. 법무부는 결국 양식을 바꿨다. 왕국은 당신을 저항의 우두머리라 불렀다. 당신은 면회 온 아이에게 말했다. “사람을 앞에 세우는 건 쉽다. 뒤에 혼자 남지 않게 하는 게 어렵지.”","recapRules":[{"when":{"op":"contains","path":"flags","value":"family_appealed"},"text":"출생신고소에서 부모가 적어 낸 첫 이의신청은 마지막까지 당신의 이름 곁에 남아 있었다."},{"when":{"op":"contains","path":"flags","value":"family_salary_question"},"text":"부모가 처음 물었던 “그 일을 하면 월급은 나옵니까?”라는 말이 이제야 다른 의미로 들렸다."},{"when":{"op":"contains","path":"flags","value":"family_original_copy"},"text":"아버지 주머니에 접혀 있던 출생신고서 사본은 오래된 소문보다 정확하게 당신의 출발을 기억했다."},{"when":{"op":"contains","path":"flags","value":"resist_nonviolent"},"text":"처음에 무기를 내려놓기로 한 약속이야말로 군중이 당신을 믿은 이유였다."},{"when":{"op":"contains","path":"flags","value":"resist_dialogue"},"text":"시민 대표를 세운 뒤 당신 혼자의 말보다 여러 사람이 직접 한 증언이 오래 남았다."},{"when":{"op":"contains","path":"flags","value":"resist_press"},"text":"인쇄소의 돈줄을 찾는 동안 뜻밖에도 당신의 얼굴로 생계를 잇던 사람들을 만나야 했다."},{"when":{"op":"contains","path":"flags","value":"resist_march"},"text":"당신이 앞줄을 지키면서도 군중의 퇴로를 열어 둔 선택은 끝내 폭력을 막는 단서가 됐다."},{"when":{"op":"contains","path":"flags","value":"resist_plate"},"text":"보관했던 인쇄판에는 국가의 거짓말이 손으로 만질 수 있을 만큼 선명하게 새겨져 있었다."}]},"end_resistance_network":{"id":"end_resistance_network","kind":"bittersweet","title":"창문마다 켜진 불","body":"왕국이 광장을 폐쇄하자 시민들은 빵집, 목공소, 저녁 식탁에서 이야기하기 시작했다. 어느 하나를 해산시킬 수 없었다. 당신은 더 이상 지도자가 아니었다. 몇 년 뒤 신문은 ‘마왕 반란단의 실종’을 보도했다. 당신은 실종되지 않았다. 그날도 이웃집 창문을 고치고 있었다.","recapRules":[{"when":{"op":"contains","path":"flags","value":"family_appealed"},"text":"출생신고소에서 부모가 적어 낸 첫 이의신청은 마지막까지 당신의 이름 곁에 남아 있었다."},{"when":{"op":"contains","path":"flags","value":"family_salary_question"},"text":"부모가 처음 물었던 “그 일을 하면 월급은 나옵니까?”라는 말이 이제야 다른 의미로 들렸다."},{"when":{"op":"contains","path":"flags","value":"family_original_copy"},"text":"아버지 주머니에 접혀 있던 출생신고서 사본은 오래된 소문보다 정확하게 당신의 출발을 기억했다."},{"when":{"op":"contains","path":"flags","value":"resist_nonviolent"},"text":"처음에 무기를 내려놓기로 한 약속이야말로 군중이 당신을 믿은 이유였다."},{"when":{"op":"contain 소 현판에서 미나의 이름도 당신의 이름도 내려갔다. 사람들은 영웅을 잃었다고 걱정했다. 미나는 웃었다. “이제 열쇠가 한 사람에게 없으니까요.” 어느 겨울, 아무도 유명하지 않은 구조대가 수십 명을 살렸다. 신문은 누가 지휘했는지 찾지 못했다. 당신은 그 기사를 읽으며 차를 끓였다.","recapRules":[{"when":{"op":"contains","path":"flags","value":"family_appealed"},"text":"출생신고소에서 부모가 적어 낸 첫 이의신청은 마지막까지 당신의 이름 곁에 남아 있었다."},{"when":{"op":"contains","path":"flags","value":"family_salary_question"},"text":"부모가 처음 물었던 “그 일을 하면 월급은 나옵니까?”라는 말이 이제야 다른 의미로 들렸다."},{"when":{"op":"contains","path":"flags","value":"family_original_copy"},"text":"아버지 주머니에 접혀 있던 출생신고서 사본은 오래된 소문보다 정확하게 당신의 출발을 기억했다."},{"when":{"op":"contains","path":"flags","value":"rescue_clinic"},"text":"첫 홍수 때 열었던 작은 구호소가 결국 왕국에서 가장 믿을 만한 의료 공간이 됐다."},{"when":{"op":"contains","path":"flags","value":"rescue_accounts"},"text":"재정 공개를 고집했던 덕분에 지원을 받으면서도 운영을 감시받을 준비가 되어 있었다."},{"when":{"op":"contains","path":"flags","value":"rescue_training"},"text":"미나 혼자가 아니라 여러 마을을 훈련시킨 결과, 그녀가 없는 날에도 구조는 이어졌다."},{"when":{"op":"contains","path":"flags","value":"rescue_negotiation"},"text":"정당한 조건을 놓고 협상해 온 경험이 마지막 지원 계약에서 빛났다."},{"when":{"op":"contains","path":"flags","value":"rescue_decentral"},"text":"각 마을에 운영권을 나눠 준 결정 덕분에 구조대는 유명한 한 사람에게 매달리지 않았다."}]},"end_rescue_accord":{"id":"end_rescue_accord","kind":"bittersweet","title":"갑옷 밖의 약속","body":"군과 체결한 문서에는 환자의 거부권, 기록 열람권, 민간 감사 조항이 적혔다. 군인은 명령을 내렸고 시민 대표는 질문을 했다. 처음엔 모두 불편해했다. 하지만 다음 홍수 때 구조대는 더 빨리 움직였다. 미나는 당신의 낡은 밧줄을 내려다보며 말했다. “그때보다 매듭이 좋아졌네.” 당신은 웃었다. “전투력은 그대로야.”","recapRules":[{"when":{"op":"contains","path":"flags","value":"family_appealed"},"text":"출생신고소에서 부모가 적어 낸 첫 이의신청은 마지막까지 당신의 이름 곁에 남아 있었다."},{"when":{"op":"contains","path":"flags","value":"family_salary_question"},"text":"부모가 처음 물었던 “그 일을 하면 월급은 나옵니까?”라는 말이 이제야 다른 의미로 들렸다."},{"when":{"op":"contains","path":"flags","value":"family_original_copy"},"text":"아버지 주머니에 접혀 있던 출생신고서 사본은 오래된 소문보다 정확하게 당신의 출발을 기억했다."},{"when":{"op":"contains","path":"flags","value":"rescue_clinic"},"text":"첫 홍수 때 열었던 작은 구호소가 결국 왕국에서 가장 믿을 만한 의료 공간이 됐다."},{"whe  const a=el('actions');a.replaceChildren();if(!ending){for(const c of curr.choices){if(!checked(c.enabledWhen,state.flags))continue;const b=document.createElement('button');b.textContent='❯ '+c.text;b.onclick=()=>{const o=c.outcomes.find(o=>checked(o.when,state.flags));if(!o)return;undo.push(structuredClone(state));state.flags=[...new Set([...state.flags,...(o.effects||[]).filter(e=>e.op==='addToSet'&&e.path==='flags').map(e=>e.value)])];state.history.push({node:state.node,choice:c.id,outcome:o.id});state.last=o.narrative||'';state.node=o.to.id;show();window.scrollTo({top:0,behavior:'smooth'})};a.append(b)}}else{const b=document.createElement('button');b.textContent='↺ 다른 인생으로 다시 시작';b.onclick=restart;a.append(b)}
 el('undo').disabled=undo.length===0;
}
function restart(){state={node:'birth',flags:[],history:[],last:''};undo=[];show();window.scrollTo(0,0)}
el('undo').onclick=()=>{if(undo.length){state=undo.pop();show()}};el('restart').onclick=restart;show();
